services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repolens-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: repolens_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repolens_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
